# Starship prompt, shared by bash and zsh. Docs: https://starship.rs/config/
# Layout of the original bash PS1 (~/.bashrc.bak-2026-10-25) as a powerline bar:
#   ╭─> dir ▶ branch* ▶   (notched start, arrows between and at the end; * = uncommitted changes)
# The notch is an arrow in colour 232 (#080808), the tmux pane background (window-style).
#   ╰─❯❯❯          (the >>> pointer, now red after a failed command)
# Segment backgrounds are the colours the old PS1 text rendered in (gnome-terminal Tango
# palette, bold is bright): path bold blue = bright-blue #729FCF; the branch red #CC0000 is
# lifted to bright-red #EF2929 so black text reads on it too.
# Text is 256-colour 16 (true black; palette "black" is #2E3436): 7.6:1 on the blue, 5.0:1 on
# the bright red (3.6:1 on #CC0000).
# The arrows (U+E0B0) and icons (folder U+F07C, branch U+F418) are Nerd Font
# glyphs; they show as boxes in an editor without that font.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
continuation_prompt = "> "

format = """
[╭─](fg:bright-blue)[](bg:bright-blue fg:232)$directory$git_branch$git_commit${custom.git_end}
[╰─](fg:bright-blue)$character"""

# like bash \w: full path, ~ for home; two spaces after the folder icon, which spills past
# one cell. Outside a repo the directory closes the bar itself; inside one (repo_root_format)
# git_branch/git_commit draw the arrow and custom.git_end closes it.
[directory]
truncation_length = 100
truncate_to_repo = false
style = "bold bg:bright-blue fg:16"
format = "[   $path ]($style)[](fg:bright-blue)"
repo_root_style = "bold bg:bright-blue fg:16"
before_repo_root_style = "bold bg:bright-blue fg:16"
repo_root_format = "[   $before_root_path$repo_root$path ]($style)"

[git_branch]
only_attached = true
symbol = ""
style = "bold bg:bright-red fg:16"
format = '[](fg:bright-blue bg:bright-red)[ $symbol $branch]($style)'

[git_commit]
only_detached = true
style = "bold bg:bright-red fg:16"
format = '[](fg:bright-blue bg:bright-red)[ \(HEAD detached at $hash\)]($style)'

# closes the git segment: "*" right after the branch when git status shows changes (staged,
# unstaged or untracked: the same check as parse_git_dirty in ~/.bashrc), then the end arrow.
# A git status slower than starship's 500ms command_timeout drops the "*" and prints a
# timeout warning.
[custom.git_end]
description = "* for uncommitted changes, then the git segment's end arrow"
require_repo = true
when = true
shell = ["sh"]
command = 'if [ -n "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain 2>/dev/null)" ]; then printf "*"; fi'
style = "bold bg:bright-red fg:16"
format = '[$output ]($style)[](fg:bright-red)'

# line 2 pointer: bar blue, bright red when the last command failed
[character]
success_symbol = "[❯❯❯](bold bright-blue)"
error_symbol = "[❯❯❯](bold bright-red)"
